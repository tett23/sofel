[package]
name = "sofel-read-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
sofel-read = { path = "../crates/sofel-read" }
sofel-font = { path = "../crates/sofel-font" }
sofel-geom = { path = "../crates/sofel-geom" }
sofel-outline = { path = "../crates/sofel-outline" }
sofel-raster = { path = "../crates/sofel-raster" }
sofel-shape = { path = "../crates/sofel-shape" }
sofel-subset = { path = "../crates/sofel-subset" }

# Not part of the main workspace (ADR 0007).
[workspace]
members = ["."]

[[bin]]
name = "cmap"
path = "fuzz_targets/cmap.rs"
test = false
doc = false
bench = false

