[package]
name = "sofel-read-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
sofel-read = { path = "../crates/sofel-read" }
sofel-font = { path = "../crates/sofel-font" }
sofel-geom = { path = "../crates/sofel-geom" }
sofel-outline = { path = "../crates/sofel-outline" }
sofel-raster = { path = "../crates/sofel-raster" }

# Not part of the main workspace (ADR 0007).
[workspace]
members = ["."]

[[bin]]
name = "cmap"
path = "fuzz_targets/cmap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metrics"
path = "fuzz_targets/metrics.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font"
path = "fuzz_targets/font.rs"
test = false
doc = false
bench = false

[[bin]]
name = "outline"
path = "fuzz_targets/outline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "os2"
path = "fuzz_targets/os2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "name"
path = "fuzz_targets/name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vorg"
path = "fuzz_targets/vorg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "post"
