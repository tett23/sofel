[package]
name = "sofel-capi"
description = "The C ABI of sofel (ADR 0015)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
sofel-png = { path = "../sofel-png" }
sofel-gpu = { path = "../sofel-gpu" }
sofel-vector = { path = "../sofel-vector" }
sofel-read = { path = "../sofel-read" }
sofel-geom = { path = "../sofel-geom" }
sofel-font = { path = "../sofel-font" }
sofel-outline = { path = "../sofel-outline" }
sofel-raster = { path = "../sofel-raster" }
sofel-bitmap = { path = "../sofel-bitmap" }
sofel-color = { path = "../sofel-color" }
sofel-cli = { path = "../sofel-cli" }
sofel-unicode = { path = "../sofel-unicode" }
sofel-shape = { path = "../sofel-shape" }
sofel-subset = { path = "../sofel-subset" }
sofel-write = { path = "../sofel-write" }

# The workspace lints, except that `unsafe` is allowed: this crate turns
# the pointers C passes into references (ADR 0015). Every other crate
# keeps `unsafe_code = "forbid"` (scripts/check-deps.sh checks it).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
