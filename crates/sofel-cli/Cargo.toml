[package]
name = "sofel-cli"
description = "Small command-line tools built on sofel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sofel-geom = { path = "../sofel-geom" }
sofel-read = { path = "../sofel-read" }
sofel-font = { path = "../sofel-font" }
sofel-outline = { path = "../sofel-outline" }
sofel-raster = { path = "../sofel-raster" }
sofel-shape = { path = "../sofel-shape" }
sofel-bitmap = { path = "../sofel-bitmap" }
sofel-color = { path = "../sofel-color" }
sofel-svg = { path = "../sofel-svg" }
sofel-subset = { path = "../sofel-subset" }

[[bin]]
name = "sofel-validate"
path = "src/bin/sofel-validate.rs"

[[bin]]
name = "sofel-render"
path = "src/bin/sofel-render.rs"

[[bin]]
name = "sofel-shape"
path = "src/bin/sofel-shape.rs"
# Its documentation would overwrite sofel_shape's (the same file name).
doc = false

[[bin]]
name = "sofel-paint"
path = "src/bin/sofel-paint.rs"

[[bin]]
name = "sofel-subset"
path = "src/bin/sofel-subset.rs"
# The library crate sofel-subset has the same documentation path.
doc = false

[lints]
workspace = true
