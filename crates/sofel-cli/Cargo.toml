[package]
name = "sofel-cli"
description = "Small command-line tools built on sofel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sofel-read = { path = "../sofel-read" }
sofel-font = { path = "../sofel-font" }
sofel-outline = { path = "../sofel-outline" }
sofel-raster = { path = "../sofel-raster" }
sofel-bitmap = { path = "../sofel-bitmap" }
sofel-color = { path = "../sofel-color" }

[[bin]]
name = "sofel-validate"
path = "src/bin/sofel-validate.rs"

[[bin]]
name = "sofel-render"
path = "src/bin/sofel-render.rs"

[[bin]]
name = "sofel-paint"
path = "src/bin/sofel-paint.rs"

[lints]
workspace = true
