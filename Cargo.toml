[workspace]
resolver = "3"
members = ["crates/sofel-geom", "crates/sofel-vector", "crates/sofel-gpu", "crates/sofel-inflate", "crates/sofel-png", "crates/sofel-svg", "crates/sofel-unicode", "crates/sofel-read", "crates/sofel-font", "crates/sofel-write", "crates/sofel-woff", "crates/sofel-subset", "crates/sofel-shape", "crates/sofel-outline", "crates/sofel-bitmap", "crates/sofel-color", "crates/sofel-raster", "crates/sofel-cli", "crates/sofel-capi", "crates/sofel-conformance"]
# sofel-conformance needs fetched test data and ft-dump (ADR 0005, ADR 0008).
default-members = ["crates/sofel-geom", "crates/sofel-vector", "crates/sofel-gpu", "crates/sofel-inflate", "crates/sofel-png", "crates/sofel-svg", "crates/sofel-unicode", "crates/sofel-read", "crates/sofel-font", "crates/sofel-write", "crates/sofel-woff", "crates/sofel-subset", "crates/sofel-shape", "crates/sofel-outline", "crates/sofel-bitmap", "crates/sofel-color", "crates/sofel-raster", "crates/sofel-cli", "crates/sofel-capi"]
exclude = ["fuzz", "tools/font-gallery"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tett23/sofel"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
