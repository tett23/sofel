[workspace]
resolver = "3"
members = ["crates/sofel-read", "crates/sofel-cli", "crates/sofel-conformance"]
# sofel-conformance needs fetched test data and ft-dump (ADR 0005, ADR 0008).
default-members = ["crates/sofel-read", "crates/sofel-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tett23/sofel"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
