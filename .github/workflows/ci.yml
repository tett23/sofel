name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # ADR 0033: the first run starts a fresh Actions cache generation.
  SOFEL_CACHE_GENERATION: adr0033-v1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-docs-only.sh

  # docs/adr/0007
  rust:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml selects the version, components and targets.
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test
      # API documentation: every public item documented, no broken links.
      - name: Build the API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p sofel-woff -p sofel-geom -p sofel-unicode -p sofel-read -p sofel-font -p sofel-write -p sofel-subset -p sofel-outline -p sofel-bitmap -p sofel-color -p sofel-raster -p sofel-shape -p sofel-cli -p sofel-capi
      # docs/adr/0003, docs/adr/0008
      - name: Check crate dependencies
        run: sh scripts/check-deps.sh
      # docs/adr/0008
      - name: Install adr-guard for protection regression tests
        shell: bash
        run: |
          set -euo pipefail
          version=v0.10.0
          archive="adr-guard-$version-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/tett23/adr-guard/releases/download/$version"
          dir="$RUNNER_TEMP/adr-guard-test"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSLO "$url/$archive"
          curl -fsSLO "$url/SHA256SUMS"
          grep -F " $archive" SHA256SUMS | sha256sum -c -
          tar -xzf "$archive"
          printf '%s\n' "$dir/${archive%.tar.gz}" >> "$GITHUB_PATH"
      - name: Test scripts
        run: sh scripts/run-tests.sh
      # docs/adr/0015: the C ABI. The sanitizers of ubuntu-latest need
      # fewer random bits in mmap addresses than the kernel's default.
      - name: Test the C ABI
        run: sh scripts/test-capi.sh
      - name: Check that the C ABI covers the public API
        run: sh scripts/check-capi.sh
      - name: Test the C ABI with sanitizers
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          sh scripts/test-capi.sh tsan
          sh scripts/test-capi.sh asan

  # ADR 0039: reproduce the committed tables on each host.
  generators:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/gen-unicode/target
            tools/gen-ot-tag/target
            tools/gen-machine/target
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-${{ runner.arch }}-generators-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/*/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-${{ runner.arch }}-generators-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/*/Cargo.lock') }}-
      - id: testdata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/testdata/harfbuzz
            target/testdata/freetype
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-testdata-${{ hashFiles('testdata.lock') }}
      # With a cache hit, the offline mode fails if the cache is incomplete.
      - name: Fetch test data
        env:
          SOFEL_TESTDATA_OFFLINE: ${{ steps.testdata.outputs.cache-hit == 'true' && '1' || '0' }}
        run: sh scripts/fetch-testdata.sh
      # docs/adr/0019: the UCD files, pinned by SHA-256 in ucd.lock.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ucd
          key: ${{ env.SOFEL_CACHE_GENERATION }}-ucd-${{ hashFiles('ucd.lock') }}
      - name: Fetch the UCD files
        run: sh scripts/fetch-ucd.sh
      # docs/adr/0019: the generated Unicode tables are those committed.
      - name: Test the Unicode table generator
        run: |
          cargo fmt --check --manifest-path tools/gen-unicode/Cargo.toml
          cargo test --release --manifest-path tools/gen-unicode/Cargo.toml
      - name: Regenerate the Unicode tables
        run: |
          cargo run --release --manifest-path tools/gen-unicode/Cargo.toml
          git diff --exit-code
      # docs/adr/0020: the generated language tag table is the one committed.
      - name: Test the language tag table generator
        run: |
          cargo fmt --check --manifest-path tools/gen-ot-tag/Cargo.toml
          cargo test --release --manifest-path tools/gen-ot-tag/Cargo.toml
      - name: Regenerate the language tag table
        run: |
          cargo run --release --manifest-path tools/gen-ot-tag/Cargo.toml
          git diff --exit-code
      # docs/adr/0024: the generated syllable machines are those committed.
      - name: Test the syllable machine generator
        run: |
          cargo fmt --check --manifest-path tools/gen-machine/Cargo.toml
          cargo test --release --manifest-path tools/gen-machine/Cargo.toml
      - name: Regenerate the syllable machines
        run: |
          cargo run --release --manifest-path tools/gen-machine/Cargo.toml
          git diff --exit-code

  # docs/adr/0005, docs/adr/0008
  conformance:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-${{ runner.arch }}-conformance-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/*/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-${{ runner.arch }}-conformance-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/*/Cargo.lock') }}-
      - id: testdata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/testdata/harfbuzz
            target/testdata/freetype
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-testdata-${{ hashFiles('testdata.lock') }}
      # With a cache hit, the offline mode fails if the cache is incomplete.
      - name: Fetch test data
        env:
          SOFEL_TESTDATA_OFFLINE: ${{ steps.testdata.outputs.cache-hit == 'true' && '1' || '0' }}
        run: sh scripts/fetch-testdata.sh
      - name: Compare embedded PNG pixels with FreeType
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpng-dev
          SOFEL_FT_PNG=1 sh tools/ft-dump/build.sh target/testdata/freetype "$RUNNER_TEMP/ft-dump-png"
          SOFEL_FT_DUMP="$RUNNER_TEMP/ft-dump-png" cargo test --release -p sofel-conformance --test freetype_sbit i1_sbit_png -- --ignored
      - name: Compare rendered PDF pages
        if: runner.os == 'Linux'
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          cargo test --release -p sofel-conformance --test vector_page -- --ignored
          sh tools/vector-reference/compare.sh
      - name: Compare WOFF and WOFF2 tables with FreeType
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libbrotli-dev
          cargo build --release -p sofel-woff -p sofel-cli --bin sofel-woff --bin sofel-subset
          sh tools/ft-dump/build.sh target/testdata/freetype "$RUNNER_TEMP/webfont-compare" --webfont-reference
          sh tools/webfont-reference/check.sh target/testdata/harfbuzz/test/subset/data/fonts target/release/sofel-woff target/release/sofel-subset "$RUNNER_TEMP/webfont-compare"
      - id: extra_fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/testdata/extra-fonts
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-extra-fonts-${{ hashFiles('fonts.lock', 'conformance/fonts.tsv') }}
      - name: Fetch extra fonts and licenses
        env:
          SOFEL_FONTS_OFFLINE: ${{ steps.extra_fonts.outputs.cache-hit == 'true' && '1' || '0' }}
        run: sh scripts/fetch-fonts.sh
      - name: Compare gallery sbix glyphs with FreeType
        if: runner.os == 'Linux'
        run: SOFEL_FT_DUMP="$RUNNER_TEMP/ft-dump-png" cargo test --release -p sofel-conformance --test freetype_sbit i2_sbix_gallery -- --ignored
      - name: Compare gallery COLRv1 glyphs with HarfBuzz raster
        if: runner.os == 'Linux'
        run: |
          sh tools/hb-raster-reference/build.sh target/testdata/harfbuzz "$RUNNER_TEMP/hb-raster-reference"
          sh tools/hb-raster-reference/check.sh target/testdata conformance/color-raster "$RUNNER_TEMP/hb-raster-reference"
      # sofel ADR 0069: render the same local gallery and keep the image.
      - name: Render font gallery
        if: matrix.os == 'ubuntu-latest'
        env:
          SOFEL_TESTDATA_OFFLINE: '1'
          SOFEL_FONTS_OFFLINE: '1'
        run: sh scripts/render-font-gallery.sh
      - name: Upload font gallery
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: font-gallery-${{ github.sha }}
          path: target/font-gallery/
          if-no-files-found: error
          retention-days: 14
      # docs/adr/0019: the UCD files, pinned by SHA-256 in ucd.lock.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ucd
          key: ${{ env.SOFEL_CACHE_GENERATION }}-ucd-${{ hashFiles('ucd.lock') }}
      - name: Fetch the UCD files
        run: sh scripts/fetch-ucd.sh
      # ADR 0033: only an exact compiler, runner image and source match
      # reuses the C reference executables; the comparisons always run.
      - name: Identify the native toolchain
        id: native-toolchain
        shell: bash
        run: |
          key=$({ ${CC:-cc} --version; ${CXX:-c++} --version; printf '%s\n' "$ImageOS" "$ImageVersion"; } | shasum -a 256 | cut -d ' ' -f 1)
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - id: reference-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ft-dump
            target/hb-dump
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-${{ runner.arch }}-reference-tools-${{ steps.native-toolchain.outputs.key }}-${{ hashFiles('.github/workflows/ci.yml', 'testdata.lock', 'tools/ft-dump/**', 'tools/hb-dump/**') }}
      - name: Build ft-dump
        if: steps.reference-tools.outputs.cache-hit != 'true'
        run: sh scripts/measure-process-tree.sh sh tools/ft-dump/build.sh
      # docs/adr/0016
      - name: Build hb-dump
        if: steps.reference-tools.outputs.cache-hit != 'true'
        run: sh scripts/measure-process-tree.sh sh tools/hb-dump/build.sh
      - name: Compare with FreeType and HarfBuzz
        run: sh scripts/measure-process-tree.sh sh scripts/test-conformance.sh 2
      # docs/adr/0021: the same hash as on wasm32 (the wasm job).
      - name: Hash CFF outlines natively
        env:
          SOFEL_REQUIRE_TESTDATA: '1'
        run: cargo test --release -p sofel-outline --test cff_hash
      # docs/adr/0020: the same hash of the --shape pairs as on wasm32.
      - name: Hash shaping natively
        env:
          SOFEL_REQUIRE_TESTDATA: '1'
        run: cargo test --release -p sofel-shape --test shape_hash
      # docs/adr/0023: the bits of the trigonometry and transforms, as on
      # x86-64 (rust job) and wasm32 (wasm job); macos-latest is aarch64.
      - name: Hash the trigonometry natively
        run: cargo test --release -p sofel-geom --test paint -- trigonometry_and_transforms_are_deterministic
      - name: Hash variation arithmetic natively
        run: cargo test --release -p sofel-font --test variation_arithmetic_digest
      # docs/adr/0020, docs/adr/0022: the C shaping and Golem subsetting
      # tests on real fonts of the test data, and their expected values from
      # the Rust API, the subsetting ones checked against hb-dump --subset
      # (skipped in the rust job, which has no test data).
      - name: Test the C ABI's shaping and subsetting
        env:
          SOFEL_REQUIRE_TESTDATA: '1'
        run: |
          cargo test -p sofel-capi --test fixture
          cargo test -p sofel-capi --test variation adr0027_i03_location_changes_glyf_outline_and_box
          sh scripts/test-capi.sh native

  # docs/adr/0004, docs/adr/0007
  wasm:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
      - name: Build libraries for wasm32-unknown-unknown
        run: cargo build --release --target wasm32-unknown-unknown -p sofel-read -p sofel-geom -p sofel-unicode -p sofel-font -p sofel-write -p sofel-subset -p sofel-outline -p sofel-bitmap -p sofel-color -p sofel-raster -p sofel-shape -p sofel-capi
      - name: Test libraries on wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test --target wasm32-wasip1 -p sofel-read -p sofel-geom -p sofel-unicode -p sofel-font -p sofel-write -p sofel-subset -p sofel-outline -p sofel-bitmap -p sofel-color -p sofel-raster -p sofel-shape
      # docs/adr/0021: the CFF outline hash of two test fonts, compared
      # with the committed value that the conformance job checks natively.
      - id: testdata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/testdata/harfbuzz
            target/testdata/freetype
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-testdata-${{ hashFiles('testdata.lock') }}
      - name: Fetch test data
        env:
          SOFEL_TESTDATA_OFFLINE: ${{ steps.testdata.outputs.cache-hit == 'true' && '1' || '0' }}
        run: sh scripts/fetch-testdata.sh
      - id: extra_fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/testdata/extra-fonts
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-extra-fonts-${{ hashFiles('fonts.lock', 'conformance/fonts.tsv') }}
      - name: Fetch extra fonts and licenses
        env:
          SOFEL_FONTS_OFFLINE: ${{ steps.extra_fonts.outputs.cache-hit == 'true' && '1' || '0' }}
        run: sh scripts/fetch-fonts.sh
      - name: Hash CFF outlines on wasm32-wasip1
        run: |
          export CARGO_TARGET_WASM32_WASIP1_RUNNER="wasmtime --dir=$GITHUB_WORKSPACE/target/testdata::/testdata --env SOFEL_TESTDATA=/testdata --env SOFEL_REQUIRE_TESTDATA=1"
          cargo test --release --target wasm32-wasip1 -p sofel-outline --test cff_hash
      # docs/adr/0020: the --shape pairs of the HarfBuzz comparison shaped
      # on wasm32, hashed and compared with the native hash.
      - name: Hash shaping on wasm32-wasip1
        run: |
          export CARGO_TARGET_WASM32_WASIP1_RUNNER="wasmtime --dir=$GITHUB_WORKSPACE/target/testdata::/testdata --env SOFEL_TESTDATA=/testdata --env SOFEL_REQUIRE_TESTDATA=1"
          cargo test --release --target wasm32-wasip1 -p sofel-shape --test shape_hash
      # docs/adr/0022: HarfBuzz's subsetting tests (the part that needs
      # neither hb-dump nor ft-dump) on wasm32, against the same expected
      # outputs as natively in the conformance job: the bytes do not
      # depend on the machine.
      - name: Subset on wasm32-wasip1
        run: |
          export CARGO_TARGET_WASM32_WASIP1_RUNNER="wasmtime --dir=$GITHUB_WORKSPACE::$GITHUB_WORKSPACE"
          cargo test --release --target wasm32-wasip1 -p sofel-conformance --test harfbuzz_subset
      - name: Check variable-font delta digest on wasm32-wasip1
        run: |
          export CARGO_TARGET_WASM32_WASIP1_RUNNER="wasmtime --dir=$GITHUB_WORKSPACE/target/testdata::/testdata --env SOFEL_TESTDATA=/testdata"
          cargo test --release --target wasm32-wasip1 -p sofel-conformance --test variation_reference adr0029_corpus_delta_digest
      - name: Test extra font corpus on wasm32-wasip1
        run: |
          export CARGO_TARGET_WASM32_WASIP1_RUNNER="wasmtime --dir=$GITHUB_WORKSPACE/target/testdata::/testdata --env SOFEL_TESTDATA=/testdata"
          cargo test --release --target wasm32-wasip1 -p sofel-conformance --test extra_registry --test extra_structure --test extra_cmap --test extra_metrics --test extra_outline --test extra_shape --test extra_color --test extra_variation

  # docs/adr/0007
  fuzz:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [cmap, metrics, font, outline, os2, name, post, vorg, base, math, gdef, gsub, gpos, cff, shape, deserialize, repack, gvar, feature_variations, location, variation_store]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz for 60 seconds
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60 -max_len=20000

  # docs/adr/0013: build the benchmarks natively and for wasm, and check
  # their results against FreeType and HarfBuzz once (no timing).
  bench:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bench/target
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-bench-${{ hashFiles('bench/Cargo.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
      - id: testdata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/testdata/harfbuzz
            target/testdata/freetype
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-testdata-${{ hashFiles('testdata.lock') }}
      - name: Fetch test data
        env:
          SOFEL_TESTDATA_OFFLINE: ${{ steps.testdata.outputs.cache-hit == 'true' && '1' || '0' }}
        run: sh scripts/fetch-testdata.sh
      - id: extra_fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/testdata/extra-fonts
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-extra-fonts-${{ hashFiles('fonts.lock', 'conformance/fonts.tsv') }}
      - name: Fetch extra fonts and licenses
        env:
          SOFEL_FONTS_OFFLINE: ${{ steps.extra_fonts.outputs.cache-hit == 'true' && '1' || '0' }}
        run: sh scripts/fetch-fonts.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/wasi-sdk
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-wasi-sdk-${{ hashFiles('bench/wasi-sdk.lock') }}
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
      # ADR 0033: native and wasm C archives are pure build outputs.
      - name: Identify the native toolchain
        id: native-toolchain
        shell: bash
        run: |
          key=$({ ${CC:-cc} --version; ${CXX:-c++} --version; printf '%s\n' "$ImageOS" "$ImageVersion"; } | shasum -a 256 | cut -d ' ' -f 1)
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - id: benchmark-libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/bench-c
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-${{ runner.arch }}-benchmark-libraries-${{ steps.native-toolchain.outputs.key }}-${{ hashFiles('.github/workflows/ci.yml', 'testdata.lock', 'bench/build-c.sh', 'bench/split-harfbuzz.awk', 'scripts/build-bench-c.sh', 'bench/c/**', 'bench/fetch-wasi-sdk.sh', 'bench/wasi-sdk.lock', 'tools/ft-dump/ftmodule.h') }}
      - name: Build FreeType and HarfBuzz
        if: steps.benchmark-libraries.outputs.cache-hit != 'true'
        run: sh scripts/measure-process-tree.sh sh scripts/build-bench-c.sh
      - name: Compare GPU glyph records with HarfBuzz
        run: sh tools/gpu-reference/compare.sh
      - name: Compare bitmap PDFs and sweep gradients with HarfBuzz
        if: runner.os == 'Linux'
        run: |
          if ! command -v pdftoppm >/dev/null || ! command -v rsvg-convert >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils librsvg2-bin
          fi
          sh tools/vector-reference/bitmap.sh
      - name: Test the harness
        run: |
          cargo fmt --check --manifest-path bench/Cargo.toml
          cargo test --release --manifest-path bench/Cargo.toml
      - name: Check results natively
        run: cargo run --release --manifest-path bench/Cargo.toml -- --once
      - name: Check results on wasm
        run: |
          cargo build --release --manifest-path bench/Cargo.toml --target wasm32-wasip1
          wasmtime run -W exceptions=y --dir target/testdata bench/target/wasm32-wasip1/release/sofel-bench.wasm --once

  # docs/adr/0015: the C tests of the C ABI on wasm32-wasip1, built with
  # wasi-sdk like the benchmarks' C libraries.
  capi-wasm:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-capi-wasm-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/wasi-sdk
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-wasi-sdk-${{ hashFiles('bench/wasi-sdk.lock') }}
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
      # docs/adr/0020: the fonts of the C shaping tests.
      - id: testdata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/testdata/harfbuzz
            target/testdata/freetype
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-testdata-${{ hashFiles('testdata.lock') }}
      - name: Fetch test data
        env:
          SOFEL_TESTDATA_OFFLINE: ${{ steps.testdata.outputs.cache-hit == 'true' && '1' || '0' }}
        run: sh scripts/fetch-testdata.sh
      - name: Test the C ABI on wasm32-wasip1
        env:
          SOFEL_REQUIRE_TESTDATA: '1'
        run: sh scripts/test-capi.sh wasm

  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tett23/adr-guard@624df60fe8956ef52b3a275198ee938175324496 # v0.10.0
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          allow-status: true
          allow-links: true

  ci-result:
    if: always()
    needs: [changes, adr, rust, generators, conformance, wasm, fuzz, bench, capi-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check all CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ADR_RESULT: ${{ needs.adr.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUST_RESULT: ${{ needs.rust.result }}
          GENERATORS_RESULT: ${{ needs.generators.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          BENCH_RESULT: ${{ needs.bench.result }}
          CAPI_WASM_RESULT: ${{ needs['capi-wasm'].result }}
        run: bash scripts/ci-result.sh
