name: Benchmark records

# docs/adr/0080: take benchmark records natively and on wasm in CI. Started
# by hand only; the records are uploaded as artifacts and imported into
# docs/benchmarks/ by pull request.
on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject of the record (lowercase letters and digits joined by hyphens)"
        required: true
        type: string
      filter:
        description: "Only items whose name or font contains this text (empty: all)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SOFEL_CACHE_GENERATION: adr0033-v1

jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bench/target
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-${{ runner.arch }}-bench-record-${{ hashFiles('bench/Cargo.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
      - id: testdata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/testdata/harfbuzz
            target/testdata/freetype
            target/testdata/wuffs
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-testdata-v2-${{ hashFiles('testdata.lock') }}
      - name: Fetch test data
        env:
          SOFEL_TESTDATA_OFFLINE: ${{ steps.testdata.outputs.cache-hit == 'true' && '1' || '0' }}
        run: sh scripts/fetch-testdata.sh
      - id: extra_fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/testdata/extra-fonts
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-extra-fonts-${{ hashFiles('fonts.lock', 'conformance/fonts.tsv') }}
      - name: Fetch extra fonts and licenses
        env:
          SOFEL_FONTS_OFFLINE: ${{ steps.extra_fonts.outputs.cache-hit == 'true' && '1' || '0' }}
        run: sh scripts/fetch-fonts.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/wasi-sdk
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-${{ runner.arch }}-wasi-sdk-${{ hashFiles('bench/wasi-sdk.lock') }}
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
      - name: Identify the native toolchain
        id: native-toolchain
        shell: bash
        run: |
          key=$({ ${CC:-cc} --version; ${CXX:-c++} --version; printf '%s\n' "$ImageOS" "$ImageVersion"; } | shasum -a 256 | cut -d ' ' -f 1)
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - id: benchmark-libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/bench-c
          key: ${{ env.SOFEL_CACHE_GENERATION }}-${{ runner.os }}-${{ runner.arch }}-benchmark-libraries-${{ steps.native-toolchain.outputs.key }}-${{ hashFiles('.github/workflows/bench.yml', 'testdata.lock', 'bench/build-c.sh', 'bench/split-harfbuzz.awk', 'scripts/build-bench-c.sh', 'bench/c/**', 'bench/fetch-wasi-sdk.sh', 'bench/wasi-sdk.lock', 'tools/ft-dump/ftmodule.h') }}
      - name: Build FreeType and HarfBuzz
        if: steps.benchmark-libraries.outputs.cache-hit != 'true'
        run: sh scripts/build-bench-c.sh
      - name: Build the benchmarks
        run: |
          cargo build --release --manifest-path bench/Cargo.toml
          cargo build --release --manifest-path bench/Cargo.toml --target wasm32-wasip1
      - name: Measure and write the record
        id: record
        env:
          SUBJECT: ${{ inputs.subject }}
          FILTER: ${{ inputs.filter }}
        run: |
          out=$RUNNER_TEMP/bench-record
          if [ -n "$FILTER" ]; then
            file=$(sh scripts/bench-record.sh --subject "$SUBJECT" --filter "$FILTER" --out "$out")
          else
            file=$(sh scripts/bench-record.sh --subject "$SUBJECT" --out "$out")
          fi
          cat "$file" >> "$GITHUB_STEP_SUMMARY"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) runner=linux-x64 ;;
            Linux-aarch64 | Linux-arm64) runner=linux-arm64 ;;
            Darwin-arm64) runner=macos-arm64 ;;
            Darwin-x86_64) runner=macos-x64 ;;
            *) runner=unknown ;;
          esac
          printf 'runner=%s\n' "$runner" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-record-${{ steps.record.outputs.runner }}
          path: ${{ runner.temp }}/bench-record
          if-no-files-found: error
