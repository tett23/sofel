[package]
name = "sofel-bench"
description = "Benchmarks of sofel against FreeType and HarfBuzz (ADR 0006, ADR 0013)"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
sofel-font = { path = "../crates/sofel-font" }
sofel-geom = { path = "../crates/sofel-geom" }
sofel-outline = { path = "../crates/sofel-outline" }
sofel-raster = { path = "../crates/sofel-raster" }
sofel-cli = { path = "../crates/sofel-cli" }
sofel-unicode = { path = "../crates/sofel-unicode" }
sofel-color = { path = "../crates/sofel-color" }
sofel-shape = { path = "../crates/sofel-shape" }
sofel-bitmap = { path = "../crates/sofel-bitmap" }
sofel-subset = { path = "../crates/sofel-subset" }
sofel-conformance = { path = "../crates/sofel-conformance" }

[profile.release]
debug = "line-tables-only"

# Not part of the main workspace (ADR 0006).
[workspace]
members = ["."]
